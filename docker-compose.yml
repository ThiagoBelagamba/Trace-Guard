services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traceguard
      POSTGRES_USER: traceguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceguard_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceguard -d traceguard"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: traceguard
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-traceguard_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Inspeção semântica fora do caminho quente. Não sobe com `docker compose up`
  # nem com o stack de produção: o checkpoint é grande.
  laya:
    profiles: ["laya"]
    build:
      context: ./docker/laya
      dockerfile: Dockerfile
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "8000"
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
      LAYA_PRELOAD: "1"
      LAYA_MODELS: multilingual
      LAYA_DEFAULT_MODEL: multilingual
      LAYA_THREADS: ${LAYA_THREADS:-4}
      LAYA_API_KEY: ${LAYA_API_KEY:-traceguard-secret}
    ports:
      - "8000:8000"
    volumes:
      # Bind no disco de /home. Um volume nomeado cairia em /var/lib/docker, na partição de 28 GB.
      - ./.cache/laya:/home/laya/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://traceguard:${POSTGRES_PASSWORD:-traceguard_dev}@postgres:5432/traceguard
      RABBITMQ_URL: amqp://traceguard:${RABBITMQ_PASSWORD:-traceguard_dev}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pg_data:
